<!DOCTYPE html>
<html lang="{{IDIOMA}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NOMBRE_PRODUCTO}} | {{SITIO_NOMBRE}}</title>
    <meta name="description" content="{{DESCRIPCION}}">
    
    <!-- Schema.org Product JSON-LD para Google Shopping / SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "{{NOMBRE_PRODUCTO}}",
      "description": "{{DESCRIPCION}}",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "{{MONEDA}}",
        "price": "{{PRECIO}}",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>

    <style>
        :root { --bg: #090d16; --card: #111827; --border: #1f2937; --accent: {{COLOR_PRIMARIO}}; --text: #f9fafb; --muted: #9ca3af; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; }
        .back-link { display: inline-block; color: var(--accent); text-decoration: none; font-size: 13px; margin-bottom: 20px; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        .badge { background: #831843; color: #fbcfe8; font-size: 11px; padding: 5px 12px; border-radius: 6px; font-weight: 600; text-transform: uppercase; }
        h1 { font-size: 28px; color: var(--text); margin: 16px 0 10px 0; line-height: 1.2; }
        .price { font-size: 24px; color: var(--accent); font-weight: 700; margin-bottom: 20px; }
        p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
        .cta-box { background: #1f2937; border-radius: 10px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-wa { background: #059669; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; }
        .footer { font-size: 12px; color: #4b5563; border-top: 1px solid var(--border); padding-top: 16px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al Catálogo General</a>
        <div class="card">
            <span class="badge">{{CATEGORIA}}</span>
            <h1>{{NOMBRE_PRODUCTO}}</h1>
            <div class="price">S/ {{PRECIO}}</div>
            <p>{{DESCRIPCION}}</p>
            
            <div class="cta-box">
                <div>
                    <strong style="color: #f9fafb;">¿Deseas comprar este arreglo?</strong>
                    <p style="margin: 4px 0 0 0; font-size: 12px;">Realizamos entregas a domicilio en toda Arequipa.</p>
                </div>
                <a href="https://wa.me/{{WHATSAPP}}?text=Hola,%20deseo%20comprar%20el%20producto:%20{{NOMBRE_PRODUCTO}}%20(S/{{PRECIO}})" class="btn-wa" target="_blank">📲 Pedir por WhatsApp</a>
            </div>
            
            <div class="footer">
                <span>{{SITIO_NOMBRE}}</span>
                <span>Catálogo Verificado pSEO</span>
            </div>
        </div>
    </div>
</body>
</html>
