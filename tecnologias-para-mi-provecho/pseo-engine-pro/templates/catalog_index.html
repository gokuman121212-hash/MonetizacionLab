<!DOCTYPE html>
<html lang="{{IDIOMA}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial | {{SITIO_NOMBRE}}</title>
    <style>
        :root { --bg: #090d16; --card: #111827; --border: #1f2937; --accent: {{COLOR_PRIMARIO}}; --text: #f9fafb; --muted: #9ca3af; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 32px; color: var(--text); margin-bottom: 10px; }
        p { color: var(--muted); font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .badge { background: #831843; color: #fbcfe8; font-size: 10px; padding: 4px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; align-self: flex-start; margin-bottom: 12px; }
        h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
        .price { font-size: 20px; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
        .desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
        .btn-detail { background: #1f2937; color: #f9fafb; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; border: 1px solid var(--border); transition: background 0.2s; }
        .btn-detail:hover { background: var(--accent); }
        footer { text-align: center; margin-top: 50px; font-size: 12px; color: #4b5563; border-top: 1px solid var(--border); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{SITIO_NOMBRE}}</h1>
            <p>Explora nuestro catálogo completo de arreglos y regalos con entrega inmediata.</p>
        </header>

        <div class="grid">
            {{PRODUCT_CARDS_HTML}}
        </div>

        <footer>
            Generado automáticamente con PSEO E-commerce Engine v5.0 • {{SITIO_NOMBRE}}
        </footer>
    </div>
</body>
</html>
