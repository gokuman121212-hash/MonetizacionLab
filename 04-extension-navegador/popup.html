<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MonetizacionLab Extension</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { width: 300px; background: #090d16; color: #f1f5f9; padding: 14px; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; }
        h3 { font-size: 14px; color: #38bdf8; font-weight: 600; }
        .badge { background: #0369a1; color: #bae6fd; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
        input { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 4px; padding: 6px; color: white; font-size: 12px; outline: none; margin-bottom: 6px; }
        .btn { background: #0284c7; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 600; font-size: 11px; }
        .btn:hover { background: #0369a1; }
        .footer { text-align: center; font-size: 9px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h3>MonetizacionLab Bar</h3>
        <span class="badge">v2.0 Pro</span>
    </div>
    <div class="card">
        <label>Nota Rápida de Acceso</label>
        <input type="text" id="quickNote" placeholder="Escribe un recordatorio...">
        <button class="btn" onclick="guardarNota()">Guardar Nota Local</button>
    </div>
    <div class="card">
        <label>Estado del Sistema</label>
        <p style="font-size: 12px; color: #4ade80; margin-top: 2px;">● Todos los módulos en línea</p>
    </div>
    <div class="footer">Desarrollado para productividad ágil</div>
    <script>
        function guardarNota() {
            const nota = document.getElementById('quickNote').value;
            if(nota) { alert("Nota guardada localmente con éxito."); }
        }
    </script>
</body>
</html>
