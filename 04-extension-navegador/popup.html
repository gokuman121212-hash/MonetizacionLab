<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MonetizacionLab Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { width: 260px; background: #090d16; color: #f1f5f9; padding: 16px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        h3 { font-size: 15px; color: #38bdf8; font-weight: 600; }
        .badge { background: #0369a1; color: #bae6fd; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
        p { font-size: 12px; color: #94a3b8; margin-bottom: 8px; line-height: 1.4; }
        .btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 12px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .footer { text-align: center; font-size: 10px; color: #64748b; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <h3>Asistente Pro</h3>
        <span class="badge">v1.0</span>
    </div>
    <div class="card">
        <p>Estado del sistema: <span style="color: #4ade80; font-weight: 600;">Optimizado</span></p>
        <button class="btn" onclick="ejecutarAccion()">Ejecutar Utilidad</button>
    </div>
    <div class="footer">MonetizacionLab Global</div>

    <script>
        function ejecutarAccion() {
            alert('¡Utilidad ejecutada con éxito a máxima velocidad!');
        }
    </script>
</body>
</html>
